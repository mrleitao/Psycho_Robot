<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting the dots</title><link rel="stylesheet" href="./connecting-dots.css"></head><body>
<svg id="network" role="img" aria-labelledby="title description"><title id="title">Ideas becoming connected</title><desc id="description">Points gradually link to nearby points, creating an evolving network. Older points and their connections fade as new ones appear. This is a conceptual animation, not measured data.</desc><g id="edges"></g><g id="nodes"></g></svg>
<header><div class="eyebrow">Ideas become insight</div><h1>Connect the dots.<br>Watch ideas travel.</h1><p>Ideas gather. Communities form. A new connection sends a ripple through the web.</p></header>
<div class="controls"><button id="pause" type="button">Pause connections</button><button id="restart" type="button">Start again</button><button id="theme" type="button">Light mode</button></div>
<script src="./connecting-dots.js" defer></script></body></html>
