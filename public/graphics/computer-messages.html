<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer to computer</title><link rel="stylesheet" href="./computer-messages.css"></head><body>
<svg id="scene" role="img" aria-labelledby="title desc"><title id="title">Two computers exchanging messages</title><desc id="desc">Two computer screens show a message being composed. A small light travels along their connecting cable, the receiving screen lights up, and a reply travels back. The exchange repeats.</desc><g id="drawing"></g></svg>
<header><small>A connection goes both ways</small><h1>Share a thought.<br>Start a conversation.</h1><p>An idea sent. A moment of understanding. A new perspective coming back.</p></header>
<div class="controls"><button id="pause" type="button">Pause conversation</button><button id="restart" type="button">Start again</button><button id="theme" type="button">Light mode</button></div>
