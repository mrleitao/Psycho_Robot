<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scientific discovery — from question to decision</title><style>
:root{color-scheme:dark;--bg:#0f232c;--ink:#eef2f0;--muted:#a3b8c1;--accent:#f0b7a4;--label:#f1d1b5;--contour:#568ea6;--contour-soft:#305f72;--water:#568ea6;--trees:#588471;--button:#173440}
:root[data-theme="light"]{color-scheme:light;--bg:#fbf6f1;--ink:#17313c;--muted:#4f6b78;--accent:#9c5055;--label:#305f72;--contour:#568ea6;--contour-soft:#90aab3;--water:#397790;--trees:#588471;--button:#f6e8da}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}header{position:absolute;left:clamp(24px,6vw,88px);top:clamp(30px,7vh,90px);max-width:450px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(38px,5vw,68px);line-height:1.06;font-weight:500;letter-spacing:-.045em;margin:22px 0}header p{max-width:310px;color:var(--muted);font-size:15px}.controls{position:absolute;bottom:26px;left:clamp(24px,6vw,88px);display:flex;gap:12px;flex-wrap:wrap;right:24px}button{font:inherit;font-size:12px;color:var(--ink);background:var(--button);border:1px solid #568ea6;border-radius:30px;padding:10px 16px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.embedded{background:transparent}.embedded header,.embedded .controls{display:none}@media(max-width:700px){body{position:relative;height:max(100svh,860px);overflow-y:auto}svg{position:absolute;height:100%}header{max-width:300px;top:28px}h1{font-size:36px}header p{font-size:14px;max-width:275px}.controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:20px;gap:8px}button{font-size:12px;padding:10px 12px}.embedded{height:100svh;min-height:0;overflow:hidden}}
</style></head><body>
<svg id="land" role="img" aria-labelledby="title description"><title id="title">A route reveals an unexplored landscape</title><desc id="description">A winding trail slowly uncovers contour lines, hills and waterways from a dark fog. Eight waypoints show a question-to-decision workflow. Once revealed, the route pauses, fades from beginning to end, and the final point pans to become the next starting point. This is an imagined landscape, not a geographic or historical claim.</desc><defs>
<radialGradient id="brush"><stop offset="0" stop-color="white"/><stop offset=".62" stop-color="white" stop-opacity=".94"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="3000" height="3000"><rect width="3000" height="3000" fill="black"/><g id="brushes"></g></mask>
<radialGradient id="mist"><stop stop-color="#305f72" stop-opacity=".13"/><stop offset="1" stop-color="#305f72" stop-opacity="0"/></radialGradient>
</defs><g id="world"><ellipse id="map-mist" cx="750" cy="420" rx="540" ry="340" fill="url(#mist)"/><g id="terrain" mask="url(#reveal)"></g><g id="trail"></g><g id="scout"></g><g id="reflection-pulse"></g></g><g id="screen-labels"></g><g id="markers"></g></svg>
<header><div class="eyebrow">From curiosity to informed action</div><h1>Follow the evidence.<br>Make a decision.</h1><p>Ask, research, test and learn. Draw conclusions, share what you find, and decide what comes next.</p></header>
<div class="controls"><button id="pause" type="button">Pause exploration</button><button id="restart" type="button">Explore again</button><button id="theme" type="button">Light mode</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('land'),world=$('world'),brushes=$('brushes'),terrain=$('terrain'),trail=$('trail'),markers=$('markers'),scout=$('scout'),pauseButton=$('pause');const embedded=new URLSearchParams(location.search).get('embed')==='1';document.body.classList.toggle('embedded',embedded);const DEFAULT_THEME='auto';const themePreference=matchMedia('(prefers-color-scheme: dark)'),themeButton=$('theme');let chosenTheme=new URLSearchParams(location.search).get('theme')||DEFAULT_THEME;function applyTheme(){const dark=chosenTheme==='auto'?themePreference.matches:chosenTheme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeButton.textContent=dark?'Light mode':'Dark mode';}themeButton.addEventListener('click',()=>{chosenTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme()});themePreference.addEventListener('change',()=>{if(chosenTheme==='auto')applyTheme()});applyTheme();let layout={scale:1,tx:0,ty:0,width:1200,height:800,mobile:false};const media=matchMedia('(prefers-reduced-motion: reduce)');let paused=media.matches,time=0,last=null,raf=null,seed=71;
const DURATION=30000,HOLD=2500,ERASE=3200,PAN=2200;if(media.matches)time=DURATION*.64;const knots=[[350,650],[430,590],[455,505],[560,465],[645,520],[750,445],[705,350],[800,275],[925,320],[1030,230],[1080,140]];
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function curve(t){const u=Math.max(0,Math.min(.999999,t))*(knots.length-1),i=Math.floor(u),v=u-i,a=knots[Math.max(0,i-1)],b=knots[i],c=knots[Math.min(knots.length-1,i+1)],d=knots[Math.min(knots.length-1,i+2)];return[0,1].map(k=>.5*((2*b[k])+(-a[k]+c[k])*v+(2*a[k]-5*b[k]+4*c[k]-d[k])*v*v+(-a[k]+3*b[k]-3*c[k]+d[k])*v*v*v));}
const originalPoints=Array.from({length:2001},(_,i)=>curve(i/2000));
function resample(raw){const distance=[0];for(let i=1;i<raw.length;i++)distance.push(distance[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));let index=1;return Array.from({length:321},(_,i)=>{const d=i/320*distance[distance.length-1];while(index<distance.length-1&&distance[index]<d)index++;const f=(d-distance[index-1])/(distance[index]-distance[index-1]||1);return[raw[index-1][0]+(raw[index][0]-raw[index-1][0])*f,raw[index-1][1]+(raw[index][1]-raw[index-1][1])*f];});}
let points=resample(originalPoints),labelBoxes=[];
const names=['ASK A QUESTION','RESEARCH WHAT’S KNOWN','FORM A HYPOTHESIS','TEST THE HYPOTHESIS','CLEAN DATA','ANALYZE THE RESULTS','DRAW A CONCLUSION','MAKE A DECISION'];
const waypoints=names.map((name,n)=>({name,i:Math.round(n*320/(names.length-1))}));
function pointAt(value){const i=Math.min(319,Math.floor(value)),f=value-i;return[points[i][0]+(points[i+1][0]-points[i][0])*f,points[i][1]+(points[i+1][1]-points[i][1])*f];}
function placeLabels(){const used=[],font=layout.mobile?13:14;labelBoxes=waypoints.map((w,n)=>{const a=points[w.i],px=a[0]*layout.scale+layout.tx,py=a[1]*layout.scale+layout.ty,words=w.name.split(' '),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>18&&line){lines.push(line);line=word;}else line=(line+' '+word).trim();}if(line)lines.push(line);const width=Math.max(...lines.map(t=>t.length))*(font*.62+.5),height=lines.length*font*1.3;let candidates=[];
for(const gap of [10,14])candidates.push({x:px+gap,y:py-height/2},{x:px-width-gap,y:py-height/2},{x:px-width/2,y:py-height-gap},{x:px-width/2,y:py+gap});
let chosen=null;for(const c of candidates){if(c.x<12||c.x+width>layout.width-12||c.y<20||c.y+height>layout.height-65)continue;const overlap=used.some(b=>c.x<b.x+b.width+6&&c.x+width+6>b.x&&c.y<b.y+b.height+6&&c.y+height+6>b.y);if(!overlap){chosen=c;break;}}
if(!chosen)chosen=candidates[0];const box={x:chosen.x,y:chosen.y,width,height,lines,font,px,py,i:w.i,candidates};used.push(box);return box;});
function solve(n){if(n===labelBoxes.length)return true;const b=labelBoxes[n];for(const c of b.candidates){if(c.x<12||c.x+b.width>layout.width-12||c.y<20||c.y+b.height>layout.height-65)continue;if(labelBoxes.some(a=>a.px>c.x-9&&a.px<c.x+b.width+9&&a.py>c.y-9&&a.py<c.y+b.height+9))continue;if(labelBoxes.slice(0,n).some(a=>c.x<a.x+a.width+6&&c.x+b.width+6>a.x&&c.y<a.y+a.height+6&&c.y+b.height+6>a.y))continue;b.x=c.x;b.y=c.y;if(solve(n+1))return true;}return false;}solve(0);
}
function path(p){return p.map((v,i)=>(i?'L':'M')+v.map(n=>n.toFixed(2)).join(',')).join(' ');}
function makeTerrain(){let s='';seed=71;
// Imagined topographic contours: nested uneven rings, no actual region or borders.
for(const [cx,cy,rx,ry] of [[505,585,150,115],[640,355,180,140],[905,200,155,100],[980,520,215,145],[385,300,125,170]]){
for(let ring=0;ring<7;ring++){const scale=1-ring*.11,p=[];for(let i=0;i<=90;i++){const a=i/90*Math.PI*2,w=1+.08*Math.sin(a*3+cx)+.045*Math.sin(a*7+cy);p.push([cx+Math.cos(a)*rx*scale*w,cy+Math.sin(a)*ry*scale*w]);}s+=`<path d="${path(p)} Z" fill="none" stroke="${ring%3===0?'var(--contour)':'var(--contour-soft)'}" stroke-width="${ring%3===0?1.1:.7}" opacity=".48"/>`;}}
s+='<path d="M 1130 610 C 1010 630 1040 410 905 410 S 920 310 820 180 S 650 130 670 45" fill="none" stroke="var(--water)" stroke-width="3" opacity=".55"/><path d="M 920 407 Q 855 500 740 590" fill="none" stroke="var(--water)" stroke-width="1.3" opacity=".4"/>';
for(let i=0;i<85;i++){const x=340+random()*780,y=140+random()*530,h=5+random()*5;s+=`<path d="M ${x-4} ${y+5} L ${x} ${y-h} L ${x+4} ${y+5} M ${x} ${y-h} V ${y+9}" fill="none" stroke="var(--trees)" stroke-width="1" opacity=".6"/>`;}
terrain.innerHTML=s;}
function draw(){const clamp=v=>Math.max(0,Math.min(1,v)),erase=clamp((time-DURATION-HOLD)/ERASE),pan=clamp((time-DURATION-HOLD-ERASE)/PAN),ease=pan*pan*(3-2*pan),dx=(points[0][0]-points[320][0])*ease,dy=(points[0][1]-points[320][1])*ease;world.setAttribute('transform',`translate(${layout.tx+dx*layout.scale} ${layout.ty+dy*layout.scale}) scale(${layout.scale})`);$('screen-labels').setAttribute('transform',`translate(${dx*layout.scale} ${dy*layout.scale})`);markers.setAttribute('transform',`translate(${dx*layout.scale} ${dy*layout.scale})`);const p=Math.min(1,time/DURATION),end=Math.floor(p*320),front=pointAt(p*320);let s='';for(let i=0;i<=end;i+=4){const a=points[i];s+=`<circle cx="${a[0]}" cy="${a[1]}" r="${i===0?120:91}" fill="url(#brush)"/>`;}s+=`<circle cx="${front[0]}" cy="${front[1]}" r="91" fill="url(#brush)"/>`;brushes.innerHTML=s;
let route='',distance=0,nextDot=0;for(let i=0;i<=end;i++){const a=i===end?front:points[i];if(i){const previous=points[i-1];distance+=Math.hypot(a[0]-previous[0],a[1]-previous[1])*layout.scale;}if(distance>=nextDot){const opacity=.8*clamp((i/320-erase*1.1)*12+1);route+=`<circle cx="${a[0]}" cy="${a[1]}" r="${1.8/layout.scale}" fill="var(--accent)" opacity="${opacity}"/>`;nextDot=distance+10;}}trail.innerHTML=route;
let m='',labels='';for(const box of labelBoxes)if(box.i<=p*320){const a=points[box.i],alpha=clamp((time-box.i/320*DURATION)/450)*(box.i===320?1-pan:clamp((box.i/320-erase*1.1)*12+1));m+=`<g opacity="${box.i===320?1:alpha}">`;m+=`<circle cx="${box.px}" cy="${box.py}" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="${box.px}" cy="${box.py}" r="2" fill="var(--label)"/>`;m+='</g>';const ex=Math.max(box.x,Math.min(box.x+box.width,box.px)),ey=Math.max(box.y,Math.min(box.y+box.height,box.py));labels+=`<g opacity="${alpha}"><line x1="${box.px}" y1="${box.py}" x2="${ex}" y2="${ey}" stroke="var(--contour)" stroke-width=".8" opacity="0"/><text x="${box.x}" y="${box.y+box.font}" fill="var(--label)" stroke="var(--bg)" stroke-width="4" paint-order="stroke fill" font-family="system-ui,sans-serif" font-size="${box.font}" letter-spacing=".5">${box.lines.map((line,i)=>`<tspan x="${box.x}" dy="${i?box.font*1.3:0}">${line.replace(/&/g,'&amp;')}</tspan>`).join('')}</text></g>`;}markers.innerHTML=m;$('screen-labels').innerHTML=labels;
scout.innerHTML=`<circle cx="${front[0]}" cy="${front[1]}" r="${11/layout.scale}" fill="none" stroke="var(--accent)" stroke-opacity=".2"/><circle cx="${front[0]}" cy="${front[1]}" r="${3.5/layout.scale}" fill="var(--label)"/>`;
$('reflection-pulse').innerHTML='';scout.setAttribute('opacity',1);world.setAttribute('opacity',1);$('screen-labels').setAttribute('opacity',1);terrain.setAttribute('opacity',(1-ease)*Math.min(1,time/1000));$('map-mist').setAttribute('opacity',(1-ease)*Math.min(1,time/1000));
}

function dimensions(){const w=svg.clientWidth||innerWidth,h=svg.clientHeight||innerHeight;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const mobile=w<=900;
// Contain the complete route on narrow screens instead of cropping it.
const available=embedded?h-80:h-365,scale=mobile?Math.min((w-70)/820,available/660):Math.min((w-90)/1200,(h-50)/800),tx=mobile?w/2-710*scale:(w-1200*scale)/2,ty=mobile?(embedded?40:290)+(available-660*scale)/2-80*scale:(h-800*scale)/2;layout={width:w,height:h,scale,tx,ty,mobile};world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);points=mobile?Array.from({length:321},(_,i)=>{const t=i/320,top=embedded?45:315,bottom=h-(embedded?45:135);return[(w*(.22+.035*Math.sin(t*Math.PI*4))-tx)/scale,(top+t*(bottom-top)-ty)/scale];}):resample(originalPoints);terrain.setAttribute('transform',mobile?'translate(-200,0) scale(1,1.65)':'');placeLabels();draw();}
function frame(now){raf=null;if(last!==null)time+=Math.min(60,now-last);last=now;if(time>DURATION+HOLD+ERASE+PAN)time=0;draw();if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
function run(){if(raf!==null)cancelAnimationFrame(raf);last=null;raf=null;pauseButton.textContent=paused?'Resume exploration':'Pause exploration';draw();if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
pauseButton.addEventListener('click',()=>{paused=!paused;run()});$('restart').addEventListener('click',()=>{time=0;run()});document.addEventListener('visibilitychange',run);media.addEventListener('change',()=>{paused=media.matches;run()});new ResizeObserver(dimensions).observe(svg);makeTerrain();dimensions();run();window.TerritoryDiscovery={pause(){paused=true;run()},resume(){paused=false;run()},restart(){time=0;run()},getState(){return{phase:time<DURATION?'reveal':time<DURATION+HOLD?'hold':time<DURATION+HOLD+ERASE?'erase':'pan',paused,time,duration:DURATION,labelBoxes,layout,theme:document.documentElement.dataset.theme}}};
})();
</script></body></html>
