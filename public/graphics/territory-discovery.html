<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discovering new territory</title><style>
:root{color-scheme:dark;--bg:#0f232c;--ink:#eef2f0;--muted:#a3b8c1;--accent:#f0b7a4;--label:#f1d1b5;--contour:#568ea6;--contour-soft:#305f72;--water:#568ea6;--trees:#588471;--button:#173440}
:root[data-theme="light"]{color-scheme:light;--bg:#fbf6f1;--ink:#17313c;--muted:#4f6b78;--accent:#9c5055;--label:#305f72;--contour:#568ea6;--contour-soft:#90aab3;--water:#397790;--trees:#588471;--button:#f6e8da}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}header{position:absolute;left:clamp(24px,6vw,88px);top:clamp(30px,7vh,90px);max-width:450px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(38px,5vw,68px);line-height:1.06;font-weight:500;letter-spacing:-.045em;margin:22px 0}header p{max-width:310px;color:var(--muted);font-size:15px}.controls{position:absolute;bottom:26px;left:clamp(24px,6vw,88px);display:flex;gap:12px;flex-wrap:wrap;right:24px}button{font:inherit;font-size:12px;color:var(--ink);background:var(--button);border:1px solid #568ea6;border-radius:30px;padding:10px 16px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.embedded{background:transparent}.embedded header,.embedded .controls{display:none}@media(max-width:700px){body{position:relative;height:max(100svh,780px);overflow-y:auto}svg{position:absolute;height:100%}header{max-width:300px;top:28px}h1{font-size:36px}header p{font-size:14px;max-width:275px}.controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:20px;gap:8px}button{font-size:12px;padding:10px 12px}.embedded{height:100svh;min-height:0;overflow:hidden}}
</style></head><body>
<svg id="land" role="img" aria-labelledby="title description"><title id="title">A route reveals an unexplored landscape</title><desc id="description">A winding trail slowly uncovers contour lines, hills and waterways from a dark fog. Small waypoints mark discoveries. This is an imagined landscape, not a geographic or historical claim.</desc><defs>
<radialGradient id="brush"><stop offset="0" stop-color="white"/><stop offset=".62" stop-color="white" stop-opacity=".94"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800"><rect width="1200" height="800" fill="black"/><g id="brushes"></g></mask>
<radialGradient id="mist"><stop stop-color="#305f72" stop-opacity=".13"/><stop offset="1" stop-color="#305f72" stop-opacity="0"/></radialGradient>
</defs><g id="world"><ellipse cx="750" cy="420" rx="540" ry="340" fill="url(#mist)"/><g id="terrain" mask="url(#reveal)"></g><g id="trail"></g><g id="markers"></g><g id="scout"></g></g></svg>
<header><div class="eyebrow">Curiosity opens new ground</div><h1>Follow a question.<br>Find new territory.</h1><p>Explore what’s unfamiliar. Connect what you discover. Let each answer reveal the next possibility.</p></header>
<div class="controls"><button id="pause" type="button">Pause exploration</button><button id="restart" type="button">Explore again</button><button id="theme" type="button">Light mode</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('land'),world=$('world'),brushes=$('brushes'),terrain=$('terrain'),trail=$('trail'),markers=$('markers'),scout=$('scout'),pauseButton=$('pause');const embedded=new URLSearchParams(location.search).get('embed')==='1';document.body.classList.toggle('embedded',embedded);const DEFAULT_THEME='auto';const themePreference=matchMedia('(prefers-color-scheme: dark)'),themeButton=$('theme');let chosenTheme=new URLSearchParams(location.search).get('theme')||DEFAULT_THEME;function applyTheme(){const dark=chosenTheme==='auto'?themePreference.matches:chosenTheme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeButton.textContent=dark?'Light mode':'Dark mode';}themeButton.addEventListener('click',()=>{chosenTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme()});themePreference.addEventListener('change',()=>{if(chosenTheme==='auto')applyTheme()});applyTheme();let layout={scale:1,tx:0,ty:0,width:1200,height:800,mobile:false};const media=matchMedia('(prefers-reduced-motion: reduce)');let paused=media.matches,time=0,last=null,raf=null,seed=71;
const DURATION=36000,HOLD=4500,FADE=1800;if(media.matches)time=DURATION*.64;const knots=[[350,650],[430,590],[455,505],[560,465],[645,520],[750,445],[705,350],[800,275],[925,320],[1030,230],[1080,140]];
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function curve(t){const u=Math.max(0,Math.min(.999999,t))*(knots.length-1),i=Math.floor(u),v=u-i,a=knots[Math.max(0,i-1)],b=knots[i],c=knots[Math.min(knots.length-1,i+1)],d=knots[Math.min(knots.length-1,i+2)];return[0,1].map(k=>.5*((2*b[k])+(-a[k]+c[k])*v+(2*a[k]-5*b[k]+4*c[k]-d[k])*v*v+(-a[k]+3*b[k]-3*c[k]+d[k])*v*v*v));}
const points=Array.from({length:321},(_,i)=>curve(i/320));
function path(p){return p.map((v,i)=>(i?'L':'M')+v.map(n=>n.toFixed(2)).join(',')).join(' ');}
function makeTerrain(){let s='';seed=71;
// Imagined topographic contours: nested uneven rings, no actual region or borders.
for(const [cx,cy,rx,ry] of [[505,585,150,115],[640,355,180,140],[905,200,155,100],[980,520,215,145],[385,300,125,170]]){
for(let ring=0;ring<7;ring++){const scale=1-ring*.11,p=[];for(let i=0;i<=90;i++){const a=i/90*Math.PI*2,w=1+.08*Math.sin(a*3+cx)+.045*Math.sin(a*7+cy);p.push([cx+Math.cos(a)*rx*scale*w,cy+Math.sin(a)*ry*scale*w]);}s+=`<path d="${path(p)} Z" fill="none" stroke="${ring%3===0?'var(--contour)':'var(--contour-soft)'}" stroke-width="${ring%3===0?1.1:.7}" opacity=".48"/>`;}}
s+='<path d="M 1130 610 C 1010 630 1040 410 905 410 S 920 310 820 180 S 650 130 670 45" fill="none" stroke="var(--water)" stroke-width="3" opacity=".55"/><path d="M 920 407 Q 855 500 740 590" fill="none" stroke="var(--water)" stroke-width="1.3" opacity=".4"/>';
for(let i=0;i<85;i++){const x=340+random()*780,y=140+random()*530,h=5+random()*5;s+=`<path d="M ${x-4} ${y+5} L ${x} ${y-h} L ${x+4} ${y+5} M ${x} ${y-h} V ${y+9}" fill="none" stroke="var(--trees)" stroke-width="1" opacity=".6"/>`;}
terrain.innerHTML=s;}
function draw(){const p=Math.min(1,time/DURATION),end=Math.max(1,Math.floor(p*320)),front=points[end];let s='';for(let i=0;i<=end;i+=4){const a=points[i];s+=`<circle cx="${a[0]}" cy="${a[1]}" r="${i===0?120:91}" fill="url(#brush)"/>`;}s+=`<circle cx="${front[0]}" cy="${front[1]}" r="91" fill="url(#brush)"/>`;brushes.innerHTML=s;
trail.innerHTML=`<path d="${path(points.slice(0,end+1))}" fill="none" stroke="var(--accent)" stroke-width="3.6" vector-effect="non-scaling-stroke" stroke-dasharray="5 7" stroke-linecap="round" opacity=".8"/>`;
const waypoints=[{i:0,name:'THE FIRST QUESTION',dx:18,dy:27},{i:64,name:'A NEW CONNECTION',dx:-18,dy:-20},{i:128,name:'A DIFFERENT PERSPECTIVE',dx:18,dy:29},{i:192,name:'BEYOND THE FAMILIAR',dx:-18,dy:-20},{i:256,name:'THE NEXT QUESTION',dx:18,dy:29},{i:320,name:'ENDLESS POSSIBILITIES',dx:-18,dy:-20}];
let m='';for(const w of waypoints)if(w.i<=end){const a=points[w.i],arrival=w.i/320*DURATION,alpha=Math.max(0,Math.min(1,(time-arrival)/650)),font=layout.mobile?13:14,localFont=font/layout.scale,anchor=layout.mobile?'middle':(w.dx<0?'end':'start');let lx=a[0]+w.dx,ly=a[1]+w.dy+(1-alpha)*5;
let lines=[w.name];if(layout.mobile&&w.name.length>18){const words=w.name.split(' '),cut=Math.ceil(words.length/2);lines=[words.slice(0,cut).join(' '),words.slice(cut).join(' ')];}
const estimate=Math.max(...lines.map(t=>t.length))*font*.64;let px=lx*layout.scale+layout.tx;if(layout.mobile)px=Math.max(20+estimate/2,Math.min(layout.width-20-estimate/2,px));else {if(anchor==='end')px=Math.max(20+estimate,Math.min(layout.width-20,px));else px=Math.max(20,Math.min(layout.width-20-estimate,px));}lx=(px-layout.tx)/layout.scale;
if(layout.mobile)ly=a[1]+(w.dy<0?-19:25)/layout.scale;
m+=`<circle cx="${a[0]}" cy="${a[1]}" r="${4/layout.scale}" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.3" vector-effect="non-scaling-stroke"/><circle cx="${a[0]}" cy="${a[1]}" r="${1.4/layout.scale}" fill="var(--label)"/><text x="${lx}" y="${ly}" opacity="${alpha}" text-anchor="${anchor}" fill="var(--label)" stroke="var(--bg)" stroke-width="${4/layout.scale}" stroke-linejoin="round" paint-order="stroke fill" font-family="system-ui,sans-serif" font-size="${localFont}" letter-spacing="${.7/layout.scale}">${lines.map((line,i)=>`<tspan x="${lx}" dy="${i?localFont*1.25:0}">${line}</tspan>`).join('')}</text>`;}markers.innerHTML=m;
scout.innerHTML=`<circle cx="${front[0]}" cy="${front[1]}" r="${11/layout.scale}" fill="none" stroke="var(--accent)" stroke-opacity=".2"/><circle cx="${front[0]}" cy="${front[1]}" r="${3.5/layout.scale}" fill="var(--label)"/>`;
const opacity=time>DURATION+HOLD?Math.max(0,1-(time-DURATION-HOLD)/FADE):1;world.setAttribute('opacity',opacity);}
function dimensions(){const w=svg.clientWidth||innerWidth,h=svg.clientHeight||innerHeight;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const mobile=w<=700;
// Contain the complete route on narrow screens instead of cropping it.
const available=embedded?h-80:h-365,scale=mobile?Math.min((w-70)/820,available/660):Math.min((w-90)/1200,(h-50)/800),tx=mobile?w/2-710*scale:(w-1200*scale)/2,ty=mobile?(embedded?40:290)+(available-660*scale)/2-80*scale:(h-800*scale)/2;layout={width:w,height:h,scale,tx,ty,mobile};world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);draw();}
function frame(now){raf=null;if(last!==null)time+=Math.min(60,now-last);last=now;if(time>DURATION+HOLD+FADE)time=0;draw();if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
function run(){if(raf!==null)cancelAnimationFrame(raf);last=null;raf=null;pauseButton.textContent=paused?'Resume exploration':'Pause exploration';draw();if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
pauseButton.addEventListener('click',()=>{paused=!paused;run()});$('restart').addEventListener('click',()=>{time=0;run()});document.addEventListener('visibilitychange',run);media.addEventListener('change',()=>{paused=media.matches;run()});new ResizeObserver(dimensions).observe(svg);makeTerrain();dimensions();run();window.TerritoryDiscovery={pause(){paused=true;run()},resume(){paused=false;run()},restart(){time=0;run()},getState(){return{paused,time,duration:DURATION,layout,theme:document.documentElement.dataset.theme}}};
})();
</script></body></html>
