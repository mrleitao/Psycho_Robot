<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills, built one block at a time</title>
<style>
:root{color-scheme:dark;--paper:#0f232c;--ink:#eef2f0;--muted:#a3b8c1;--rule:#264452;--surface:#173440;--accent:#f0b7a4;--edge:#142d38;--steel:#568ea6} :root[data-theme="light"]{color-scheme:light;--paper:#fbf6f1;--ink:#17313c;--muted:#4f6b78;--rule:#dbc7b5;--surface:#f6e8da;--accent:#994b51;--edge:#9b8777;--steel:#305f72}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif;overflow:hidden}.scene{position:fixed;inset:0;pointer-events:none}body:not(.demo) header,body:not(.demo) .legend,body:not(.demo) #restart,body:not(.demo) .counter{display:none}body:not(.demo) .controls{left:auto;right:24px;bottom:20px}body:not(.demo) #pause{background:transparent;border-color:var(--rule);color:var(--muted)}svg{width:100%;height:100%;display:block}header{position:absolute;z-index:2;top:clamp(24px,6vw,80px);left:clamp(24px,6vw,88px);max-width:430px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}h1{font-size:clamp(36px,5vw,66px);line-height:1.06;font-weight:500;letter-spacing:-.045em;margin:20px 0}header p{font-size:15px;color:var(--muted);max-width:320px}.controls{position:absolute;left:clamp(24px,6vw,88px);bottom:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--steel);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:30px;font:inherit;font-size:12px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.legend{position:absolute;right:32px;bottom:32px;display:flex;gap:18px;font-size:11px;color:var(--muted)}.legend i{width:7px;height:7px;display:inline-block;margin-right:7px;border-radius:2px}.embedded header,.embedded .controls,.embedded .legend{display:none}.embedded{background:transparent}@media(max-width:700px){body.demo{position:relative;height:max(100svh,780px);overflow-y:auto}.demo .scene{position:absolute;height:100%}header{top:24px;max-width:280px}h1{font-size:36px}header p{font-size:14px;max-width:265px}.legend{display:none}.controls{bottom:max(20px,env(safe-area-inset-bottom));right:20px;gap:8px}.counter{width:100%;font-size:11px}button{min-height:44px}.demo header{max-width:calc(100% - 48px)}}@media(prefers-reduced-motion:reduce){svg{scroll-behavior:auto}}
</style></head><body>
<div class="scene"><svg id="tower" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">A tower of interlocking three-dimensional skill blocks</title><desc id="graphic-desc">Colored blocks settle into a tower that grows upward. Each layer builds on the last. This is a conceptual illustration, not measured data.</desc><defs><linearGradient id="sky" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#173440" stop-opacity=".45"/><stop offset="1" stop-color="#0f232c" stop-opacity="0"/></linearGradient></defs><defs><linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient><mask id="tower-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#fade)"/></mask></defs><defs><clipPath id="scene-clip"><rect id="scene-window" width="100%" height="100%"/></clipPath></defs><g clip-path="url(#scene-clip)"><g id="guides"></g><g id="blocks" mask="url(#tower-fade)" opacity=".82"></g></g></svg></div>
<header><div class="eyebrow">Learning is cumulative</div><h1>Every skill.<br>A stronger foundation.</h1><p>Experience connects. New capabilities fit into place. The next level builds on everything before it.</p></header>
<div class="controls"><button id="pause" type="button">Pause motion</button><button id="restart" type="button">Start again</button><button id="theme" type="button">Light mode</button><span class="counter" id="counter">Building the foundation</span></div>
<div class="legend"><span><i style="background:#568ea6"></i>Explore</span><span><i style="background:#f18c8e"></i>Practice</span><span><i style="background:#f1d1b5"></i>Connect</span></div>
<script>
(()=>{'use strict';
const svg=document.getElementById('tower'),blocks=document.getElementById('blocks'),guides=document.getElementById('guides');
const pauseButton=document.getElementById('pause'),counter=document.getElementById('counter');
const embedded=new URLSearchParams(location.search).get('embed')==='1';document.body.classList.toggle('embedded',embedded);document.body.classList.toggle('demo',new URLSearchParams(location.search).get('background')!=='1'&&!embedded);const fade=document.getElementById('fade');
const media=matchMedia('(prefers-reduced-motion: reduce)');
// One piece every 1.25s, including 950ms of travel and 300ms to rest.
const STEP=1250,DROP=950;let colors=[['#78a9bb','#568ea6','#305f72'],['#f5b6ac','#f18c8e','#ac6068'],['#f7e1cd','#f1d1b5','#b99a83'],['#7fa591','#588471','#355c50']];
const DEFAULT_THEME='auto';const colorPreference=matchMedia('(prefers-color-scheme: dark)');let themeChoice=new URLSearchParams(location.search).get('theme')||DEFAULT_THEME,appliedTheme='dark';
const palettes={dark:colors,light:[['#6e9eae','#487e94','#305f72'],['#eea09a','#d77a80','#a9505b'],['#ebc5a0','#c79b73','#99724f'],['#87a88e','#5d8569','#3e6049']]};
function setTheme(choice){themeChoice=['light','dark','auto'].includes(choice)?choice:'auto';appliedTheme=themeChoice==='auto'?(colorPreference.matches?'dark':'light'):themeChoice;document.documentElement.dataset.theme=appliedTheme;colors=palettes[appliedTheme];document.getElementById('theme').textContent=appliedTheme==='dark'?'Light mode':'Dark mode';draw();}
colorPreference.addEventListener('change',()=>{if(themeChoice==='auto')setTheme('auto')});document.getElementById('theme').addEventListener('click',()=>setTheme(appliedTheme==='dark'?'light':'dark'));
let width=0,height=0,unit=30,dy=15,zh=28,cx=0,base=0,elapsed=0,last=null,raf=null,paused=media.matches,seed=173;
let regionTop=0,regionBottom=0;let camera=0,pieces=[],active=null,nextLayer=0,queue=[],placed=0;
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
// Each 4×4 layer is tiled exactly by four tetrominoes. Rotate and reflect for variety.
const patterns=[['AAAA','BBBB','CCDD','CCDD'],['AABB','AABB','CCCC','DDDD'],['AAAB','ABBB','CCCD','CDDD']];
function layer(z){let grid=patterns[Math.floor(random()*patterns.length)].map(r=>r.split(''));const turns=Math.floor(random()*4);for(let t=0;t<turns;t++)grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse());if(random()<.5)grid=grid.map(r=>r.slice().reverse());const ids=['A','B','C','D'];if(random()<.5)ids.reverse();return ids.map((id,i)=>({z,color:(i+z)%4,cells:grid.flatMap((row,y)=>row.flatMap((v,x)=>v===id?[[x,y]]:[]))}));}
function next(){if(!queue.length)queue=layer(nextLayer++);active=queue.shift();}
function reset(){seed=173;elapsed=0;camera=0;pieces=[];queue=[];placed=0;nextLayer=0;for(let z=0;z<6;z++){const foundation=layer(z);pieces.push(...foundation);placed+=foundation.length;nextLayer=z+1;}next();last=null;draw();}
function dimensions(){width=svg.clientWidth||innerWidth;height=svg.clientHeight||innerHeight;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const mobile=width<=700,demo=!embedded&&new URLSearchParams(location.search).get('background')!=='1';regionTop=mobile&&demo?300:0;regionBottom=height-(embedded?12:mobile?100:20);unit=Math.max(8,Math.min(56,(width-48)/9,mobile?(regionBottom-regionTop)/13:height*.065));dy=unit*.5;zh=unit*.88;cx=mobile?width*.5:width*(new URLSearchParams(location.search).get('center')==='1'?.5:.69);base=mobile?regionTop+(regionBottom-regionTop)*.28+3*dy+6*zh:height*.72;const viewport=document.getElementById('scene-window');viewport.setAttribute('x',0);viewport.setAttribute('y',regionTop);viewport.setAttribute('width',width);viewport.setAttribute('height',Math.max(1,regionBottom-regionTop));draw();}
function project(x,y,z){return[cx+(x-y)*unit,base+(x+y-3)*dy-(z-camera)*zh];}
function polygon(points,fill,stroke,opacity=1){return `<polygon points="${points.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width=".7" stroke-linejoin="round" opacity="${opacity}"/>`;}
function cube(x,y,z,c){const top=[project(x,y,z+1),project(x+1,y,z+1),project(x+1,y+1,z+1),project(x,y+1,z+1)];const left=[top[3],top[2],project(x+1,y+1,z),project(x,y+1,z)];const right=[top[1],top[2],project(x+1,y+1,z),project(x+1,y,z)];return polygon(left,c[2],'var(--edge)')+polygon(right,c[1],'var(--edge)')+polygon(top,c[0],'var(--edge)');}
function silhouette(c){return [[c.x,c.y,c.z+1],[c.x+1,c.y,c.z+1],[c.x+1,c.y,c.z],[c.x+1,c.y+1,c.z],[c.x,c.y+1,c.z],[c.x,c.y+1,c.z+1]].map(v=>project(v[0],v[1],v[2]));}
function overlaps(a,b){for(const polygon of [a])for(let i=0;i<3;i++){const q=polygon[i],r=polygon[(i+1)%polygon.length],nx=-(r[1]-q[1]),ny=r[0]-q[0];let amin=Infinity,amax=-Infinity,bmin=Infinity,bmax=-Infinity;for(const v of a){const d=v[0]*nx+v[1]*ny;amin=Math.min(amin,d);amax=Math.max(amax,d)}for(const v of b){const d=v[0]*nx+v[1]*ny;bmin=Math.min(bmin,d);bmax=Math.max(bmax,d)}if(amax<=bmin+.0001||bmax<=amin+.0001)return false;}return true;}
function depthOrder(cubes){const hulls=cubes.map(silhouette),bounds=hulls.map(h=>({left:Math.min(...h.map(p=>p[0])),right:Math.max(...h.map(p=>p[0])),top:Math.min(...h.map(p=>p[1])),bottom:Math.max(...h.map(p=>p[1]))}));const edges=cubes.map(()=>[]),degree=cubes.map(()=>0);for(let i=0;i<cubes.length;i++)for(let j=i+1;j<cubes.length;j++){const u=bounds[i],v=bounds[j];if(u.right<=v.left||v.right<=u.left||u.bottom<=v.top||v.bottom<=u.top)continue;if(!overlaps(hulls[i],hulls[j]))continue;const a=cubes[i],b=cubes[j];let from=-1,to=-1;if(a.x+1<=b.x+1e-7||a.y+1<=b.y+1e-7||a.z+1<=b.z+1e-7){from=i;to=j}else if(b.x+1<=a.x+1e-7||b.y+1<=a.y+1e-7||b.z+1<=a.z+1e-7){from=j;to=i}if(from!==-1){edges[from].push(to);degree[to]++}}
const ready=[];for(let i=0;i<cubes.length;i++)if(!degree[i])ready.push(i);const result=[];for(let cursor=0;cursor<ready.length;cursor++){const i=ready[cursor];result.push(cubes[i]);for(const j of edges[i])if(--degree[j]===0)ready.push(j)}if(result.length!==cubes.length)throw new Error('Cyclic cube visibility order');return result;}
function ease(t){return 1-Math.pow(1-t,3)}
function growth(){return active?active.z+((3-queue.length)+(elapsed%STEP)/STEP)/4:3;}
function draw(){if(!width||!active)return;const progress=growth();camera=Math.max(0,progress-5);const fadeStart=project(0,0,progress-4)[1],fadeEnd=project(0,0,progress-6.5)[1];fade.setAttribute('y1',fadeStart);fade.setAttribute('y2',fadeEnd);const phase=elapsed%STEP;const t=Math.min(1,phase/DROP);const lift=paused&&media.matches?0:(1-ease(t))*(width<=700?Math.max(1,(project(0,0,active.z+1)[1]-regionTop-3*dy-12)/zh):Math.max(10,height/zh*.7));let cubes=[];for(const p of pieces){if(p.z<progress-8)continue;for(const cell of p.cells)cubes.push({x:cell[0]-2,y:cell[1]-2,z:p.z,c:p.color});}if(active)for(const cell of active.cells)cubes.push({x:cell[0]-2,y:cell[1]-2,z:active.z+lift,c:active.color});
// Orthographic visibility: establish far-to-near order only for cubes whose
// projected silhouettes overlap. Height alone cannot determine occlusion.
const occupied=new Set(cubes.map(c=>`${c.x},${c.y},${c.z}`));cubes=cubes.filter(c=>!occupied.has(`${c.x+1},${c.y},${c.z}`)||!occupied.has(`${c.x},${c.y+1},${c.z}`)||!occupied.has(`${c.x},${c.y},${c.z+1}`));
blocks.innerHTML=depthOrder(cubes).map(p=>cube(p.x,p.y,p.z,colors[p.c])).join('');
let lines='';for(let i=-3;i<=3;i++){const xx=cx+i*unit*2;lines+=`<line x1="${xx}" y1="${height*.1}" x2="${xx}" y2="${height}" stroke="var(--steel)" stroke-opacity=".08" stroke-dasharray="2 12"/>`;}
guides.innerHTML=lines;counter.textContent=`${placed} blocks connected · level ${active?active.z+1:1}`;}
function frame(now){raf=null;if(last!==null){const dt=Math.min(50,now-last);const old=Math.floor(elapsed/STEP);elapsed+=dt;if(Math.floor(elapsed/STEP)>old){pieces.push(active);placed++;next();pieces=pieces.filter(p=>p.z>=active.z-8);}}last=now;draw();if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);}
function run(){if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;pauseButton.textContent=paused?'Resume motion':'Pause motion';if(!paused&&!document.hidden)raf=requestAnimationFrame(frame);else draw();}
pauseButton.addEventListener('click',()=>{paused=!paused;run()});document.getElementById('restart').addEventListener('click',()=>{reset();run()});document.addEventListener('visibilitychange',run);media.addEventListener('change',()=>{paused=media.matches;run()});new ResizeObserver(dimensions).observe(svg);reset();dimensions();setTheme(themeChoice);run();
window.SkillTower={setTheme,pause(){paused=true;run()},resume(){paused=false;run()},restart(){reset();run()},getState(){return{theme:appliedTheme,placed,level:active.z+1,retainedPieces:pieces.length,paused,camera,growth:growth(),layout:{width,height,unit,regionTop,regionBottom,base}}}};
})();
</script></body></html>
